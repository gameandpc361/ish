name: Xcode - Build and Analyze

on: workflow_dispatch

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: installDependencies
        run: |
          brew install meson ninja lld
      - name: Pre-build Meson Core
        run: |
         echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
         echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
         find . -name "project.pbxproj" -exec sed -i '' 's/app.ish/com.egoz/
         export LDFLAGS="-L/opt/homebrew/opt/lld/lib"
         export CPPFLAGS="-I/opt/homebrew/opt/lld/include"
         meson setup builddir --backend=ninja --buildtype=release
         ninja -C builddir
      - name: Build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcodebuild -list
          echo "A"
          xcodebuild -workspace iSH.xcodeproj/project.xcworkspace -scheme iSH -destination 'generic/platform=iOS' -configuration Release \ CODE_SIGNING_ALLOWED=No \ CODE_SIGNING_REQUIRED=No \ CODE_SIGN_IDENTITY="" \ CODE_SIGNING_STYLE=Manual \-archivePath ".github/build/iSH.xcarchive" -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 clean archive  
          echo "B"
    
