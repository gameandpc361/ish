name: Xcode - Build and Analyze

on: workflow_dispatch

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Submodules Deeply
        run: |
         git submodule update --init --recursive --force
      - name: installDependencies
        run: |
          brew install meson ninja lld libarchive
      - name: Pre-build Meson Core
        run: |
         echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
         echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
         export C_INCLUDE_PATH="/opt/homebrew/opt/libarchive/include:$C_INCLUDE_PATH"
         export CPLUS_INCLUDE_PATH="/opt/homebrew/opt/libarchive/include:$CPLUS_INCLUDE_PATH"
         export LIBRARY_PATH="/opt/homebrew/opt/libarchive/lib:$LIBRARY_PATH"
         export LDFLAGS="-L/opt/homebrew/opt/lld/lib -L/opt/homebrew/opt/libarchive/lib"
         export CPPFLAGS="-I/opt/homebrew/opt/lld/include -I/opt/homebrew/opt/libarchive/include"
         meson setup builddir --backend=ninja --buildtype=release
         ninja -C builddir
      - name: Build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          C_INCLUDE_PATH: "/opt/homebrew/opt/libarchive/include"
          CPLUS_INCLUDE_PATH: "/opt/homebrew/opt/libarchive/include"
          LIBRARY_PATH: "/opt/homebrew/opt/libarchive/lib"
        run: |
          xcodebuild -list
          echo "A"
          xcodebuild -workspace iSH.xcodeproj/project.xcworkspace -scheme iSH -destination 'generic/platform=iOS' -configuration Release \ CODE_SIGNING_ALLOWED=No \ CODE_SIGNING_REQUIRED=No \ CODE_SIGN_IDENTITY="" \ CODE_SIGNING_STYLE=Manual \ COMPILER_INDEX_STORE_ENABLE=NO \ GCC_WARN_INHIBIT_ALL_WARNINGS=YES \ RUN_CLANG_STATIC_ANALYZER=NO \ CLANG_WARN_DOCUMENTATION_COMMENTS=NO \-archivePath ".github/build/iSH.xcarchive" -IDEBuildOperationMaxNumberOfConcurrentCompileTasks=1 clean archive  
          echo "B"
    
