name: Xcode - Build and Analyze

on: workflow_dispatch

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -list
          echo "A"
          xcodebuild -scheme iSH -destination 'generic/platform=iOS' -configuration Release -archivePath .\HOGE_FEATURE_DISABLE=1 clean build
          echo "B"
          xcodebuild -exportArchive \ -archivePath . \ -exportPath app/ \ -exportOptionsPlist app/Info.plist
